name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # copier reads the template from git history
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Each test copies the template and runs its tasks: git init, uv sync, uv run pytest
      - name: Test the template
        run: uv run pytest -q
