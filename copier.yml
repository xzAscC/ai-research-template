# Copier Template Configuration
# https://copier.readthedocs.io/en/stable/configuring/

# 9.6.0 added _copier_operation, used by _tasks below
_min_copier_version: "9.6.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# ============================================
# USER PROMPTS
# ============================================

project_name:
  type: str
  help: What is your project name? (use snake_case for Python packages)
  default: my_project
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Project name must start with a lowercase letter and contain only lowercase letters, numbers, and underscores.
    {% endif %}

project_description:
  type: str
  help: Brief description of your project
  default: A Python project

author_name:
  type: str
  help: Your full name (for LICENSE and pyproject.toml)
  default: Your Name

author_email:
  type: str
  help: Your email address (for pyproject.toml)
  default: your.email@example.com

# ============================================
# COMPUTED VALUES (not prompted)
# ============================================

project_slug:
  when: false
  default: "{{ project_name | lower | replace('_', '-') }}"

project_name_snake:
  when: false
  default: "{{ project_name | lower | replace('-', '_') }}"

project_display_name:
  when: false
  default: "{{ project_name | replace('_', ' ') | replace('-', ' ') | title }}"

copyright_year:
  when: false
  # strftime comes from jinja2-ansible-filters, which Copier loads by default
  default: "{{ '%Y' | strftime }}"

# ============================================
# EXCLUSIONS
# ============================================

_exclude:
  - "copier.yml"
  - "copier.yaml"
  - ".git"
  - ".DS_Store"
  - "*.py[co]"
  - "__pycache__"

# Private files the project fills in; `copier update` leaves them alone.
_skip_if_exists:
  - "AGENTS.local.md"
  - "CLAUDE.local.md"

# ============================================
# POST-GENERATION TASKS
# ============================================

# On copy and recopy, not on update: an updated project already has git and an
# environment, and its own tests may need a GPU or fail for reasons of their own.
# A new repository starts on main, the branch the CI workflow runs on. symbolic-ref
# instead of `git init -b` (git >= 2.28), and only before the first commit, so a
# recopy never moves an existing repository to another branch.
_tasks:
  - command: "git init -q && { git rev-parse -q --verify HEAD >/dev/null || git symbolic-ref HEAD refs/heads/main; }"
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["uv", "sync"]
    when: "{{ _copier_operation == 'copy' }}"
  - command: ["uv", "run", "pytest"]
    when: "{{ _copier_operation == 'copy' }}"
